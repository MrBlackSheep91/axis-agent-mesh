[project]
name = "axis-skills-server"
version = "0.1.0"
description = "AXIS Skills MCP server — shared tool-skills (type=tool) served over Streamable HTTP, multi-tenant. Phase 5b of axis-agent-mesh."
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=3,<4",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["axis_skills_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
